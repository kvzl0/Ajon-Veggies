{% extends 'base.html' %}
{% block title %}Error {{ code }} — Ajon Veggies{% endblock %}
{% block page_title %}Error{% endblock %}
{% block content %}
<div style="text-align:center; padding:60px 20px;">
    <div style="font-size:64px; margin-bottom:16px;">⚠️</div>
    <div style="font-family:'Plus Jakarta Sans',sans-serif; font-size:48px; font-weight:800; color:var(--green); margin-bottom:8px;">{{ code }}</div>
    <div style="font-size:16px; color:var(--muted); margin-bottom:28px;">{{ message }}</div>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
</div>
{% endblock %}
